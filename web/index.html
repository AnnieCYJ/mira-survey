<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>miraringfashion</title>
    <style id="expo-reset">
      /* Outer page: dark soft gradient so the phone pops */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #4b3f72 0%, #2a2344 40%, #161226 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      /* Phone frame */
      #phone-frame {
        position: relative;
        width: 390px;
        height: 844px;
        max-width: 96vw;
        max-height: 96vh;
        background: #000;
        border-radius: 52px;
        box-shadow:
          0 0 0 10px #1f1b2e,
          0 25px 70px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Dynamic Island / notch bar */
      #phone-notch {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 96px;
        height: 28px;
        background: #000;
        border-radius: 20px;
        z-index: 100;
      }

      /* Side buttons (purely cosmetic) */
      #phone-frame::before,
      #phone-frame::after {
        content: "";
        position: absolute;
        right: -14px;
        width: 6px;
        background: #2c263d;
        border-radius: 4px;
      }
      #phone-frame::before {
        top: 112px;
        height: 28px;
      }
      #phone-frame::after {
        top: 156px;
        height: 58px;
      }

      /* App rendering surface */
      #root {
        display: flex;
        flex: 1;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      /* Hide scrollbars inside the app surface */
      #root * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      #root *::-webkit-scrollbar {
        display: none;
      }

      /* Watermark label */
      #preview-label {
        position: absolute;
        bottom: -32px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.35);
        font-size: 12px;
        letter-spacing: 0.6px;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="phone-frame">
      <div id="phone-notch"></div>
      <div id="root"></div>
    </div>
    <div id="preview-label">miraringfashion · Web Preview</div>

    <!-- Expo CLI injects the app bundle script here automatically -->
  </body>
</html>
