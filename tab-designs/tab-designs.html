<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洞察页 Tab 设计方案</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #1a1a2e; padding: 40px 20px; color: #fff; }
h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
.subtitle { text-align: center; color: rgba(255,255,255,0.5); margin-bottom: 48px; font-size: 14px; }
.section { max-width: 400px; margin: 0 auto 60px; }
.section-title { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 16px; letter-spacing: 2px; text-transform: uppercase; }
.tab-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

/* ─────────────────── 方案 A: Segmented 分段控制器 ─────────────────── */
.scheme-a .segmented {
  background: rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 4px;
  display: flex;
  width: fit-content;
  position: relative;
}
.scheme-a .segmented .thumb {
  position: absolute;
  top: 4px; bottom: 4px;
  background: linear-gradient(135deg, #9D8AF0, #7C6AE0);
  border-radius: 12px;
  transition: left 0.25s ease;
  box-shadow: 0 2px 10px rgba(157,138,240,0.4);
}
.scheme-a .segmented button {
  padding: 10px 22px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.6);
  font-size: 15px;
  font-weight: 500;
  border-radius: 12px;
  cursor: pointer;
  position: relative;
  z-index: 1;
  transition: color 0.2s;
}
.scheme-a .segmented button.active { color: #fff; }

/* 子 tab: 下划线 */
.scheme-a .sub-tabs { display: flex; gap: 24px; position: relative; padding-bottom: 12px; }
.scheme-a .sub-tabs::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 1px; background: rgba(255,255,255,0.12);
}
.scheme-a .sub-tabs button {
  background: transparent; border: none; color: rgba(255,255,255,0.55);
  font-size: 14px; padding: 8px 0; cursor: pointer; position: relative;
  font-weight: 400;
}
.scheme-a .sub-tabs button.active { color: #fff; font-weight: 600; }
.scheme-a .sub-tabs button.active::after {
  content: ''; position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
  width: 24px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, #9D8AF0, #F2A3C6);
}

/* ─────────────────── 方案 B: 胶囊 + Icon ─────────────────── */
.scheme-b .pill-row { display: flex; gap: 12px; }
.scheme-b .pill {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 24px;
  border-radius: 28px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.25s;
}
.scheme-b .pill.on {
  background: linear-gradient(135deg, #9D8AF0, #7C6AE0);
  color: #fff;
  box-shadow: 0 4px 20px rgba(124,106,224,0.45);
}
.scheme-b .pill.off {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.7);
}
.scheme-b .pill svg { width: 18px; height: 18px; }

.scheme-b .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.scheme-b .chip {
  padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
}
.scheme-b .chip.on { background: rgba(157,138,240,0.2); color: #C4B5FD; border: 1px solid rgba(157,138,240,0.4); }
.scheme-b .chip.off { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.1); }

/* ─────────────────── 方案 C: 垂直分组 ─────────────────── */
.scheme-c .group {
  background: rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 6px;
  display: flex; flex-direction: column; gap: 2px;
}
.scheme-c .group button {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border: none; border-radius: 14px;
  background: transparent; color: rgba(255,255,255,0.6);
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all 0.2s;
}
.scheme-c .group button.on {
  background: linear-gradient(135deg, rgba(157,138,240,0.3), rgba(124,106,224,0.2));
  color: #E9D5FF;
}
.scheme-c .group button .badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: rgba(255,255,255,0.1);
}
.scheme-c .group button.on .badge { background: rgba(157,138,240,0.4); }

/* ─────────────────── 方案 D: Tab Bar + 指示点 ─────────────────── */
.scheme-d .top-bar {
  display: flex; justify-content: center; gap: 32px;
  padding: 12px 0;
}
.scheme-d .top-bar button {
  background: transparent; border: none; color: rgba(255,255,255,0.5);
  font-size: 16px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
}
.scheme-d .top-bar button.on { color: #fff; font-weight: 700; font-size: 17px; }
.scheme-d .top-bar button .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: transparent;
}
.scheme-d .top-bar button.on .dot { background: #9D8AF0; box-shadow: 0 0 8px #9D8AF0; }

.scheme-d .sub-scroll {
  display: flex; gap: 14px; overflow-x: auto; padding: 6px 0 10px;
  scrollbar-width: none;
}
.scheme-d .sub-scroll::-webkit-scrollbar { display: none; }
.scheme-d .sub {
  flex-shrink: 0; padding: 10px 18px; border-radius: 22px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  border: 1px solid transparent; transition: all 0.2s;
}
.scheme-d .sub.on {
  background: #fff; color: #1a1a2e; border-color: #fff;
}
.scheme-d .sub.off {
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7);
  border-color: rgba(255,255,255,0.12);
}

/* 高亮选中态 */
.demo-box {
  background: linear-gradient(180deg, #2a1f3d 0%, #1a1a2e 100%);
  border-radius: 24px; padding: 24px;
  border: 1px solid rgba(255,255,255,0.06);
}
</style>
</head>
<body>

<h1>🏥 洞察页 Tab 设计方案</h1>
<p class="subtitle">点击各方案切换查看效果</p>

<!-- ══════════ 方案 A ══════════ -->
<div class="section scheme-a">
  <div class="section-title">方案 A · Segmented + 下划线</div>
  <div class="demo-box">
    <!-- 顶层: Segmented 滑动块 -->
    <div class="segmented" id="segA">
      <div class="thumb" id="thumbA"></div>
      <button class="active" data-w="84">节律健康</button>
      <button data-w="84">长期健康</button>
    </div>
    <div style="height: 24px"></div>
    <!-- 子 tab: 下划线 -->
    <div class="sub-tabs">
      <button class="active">睡眠</button>
      <button>生理</button>
      <button>情绪 &amp; 认知</button>
    </div>
  </div>
</div>

<!-- ══════════ 方案 B ══════════ -->
<div class="section scheme-b">
  <div class="section-title">方案 B · 渐变胶囊 + Icon</div>
  <div class="demo-box">
    <div class="pill-row">
      <div class="pill on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        节律健康
      </div>
      <div class="pill off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        长期健康
      </div>
    </div>
    <div style="height: 18px"></div>
    <div class="chip-row">
      <div class="chip on">睡眠</div>
      <div class="chip off">生理</div>
      <div class="chip off">情绪 &amp; 认知</div>
    </div>
  </div>
</div>

<!-- ══════════ 方案 C ══════════ -->
<div class="section scheme-c">
  <div class="section-title">方案 C · 垂直分组 (Drawer 式)</div>
  <div class="demo-box">
    <div class="group">
      <button class="on">
        <span>节律健康</span>
        <span class="badge">3 项</span>
      </button>
      <button>
        <span>长期健康</span>
        <span class="badge">3 项</span>
      </button>
    </div>
    <div style="height: 16px"></div>
    <div class="group">
      <button class="on"><span>🌙 睡眠</span><span class="badge">皮质醇</span></button>
      <button><span>🌸 生理</span><span class="badge">周期</span></button>
      <button><span>💭 情绪 &amp; 认知</span><span class="badge">HRV</span></button>
    </div>
  </div>
</div>

<!-- ══════════ 方案 D ══════════ -->
<div class="section scheme-d">
  <div class="section-title">方案 D · 导航栏 + 白胶囊</div>
  <div class="demo-box">
    <div class="top-bar">
      <button class="on">节律健康 <span class="dot"></span></button>
      <button>长期健康 <span class="dot"></span></button>
    </div>
    <div style="height: 8px"></div>
    <div class="sub-scroll">
      <div class="sub on">睡眠</div>
      <div class="sub off">生理</div>
      <div class="sub off">情绪 &amp; 认知</div>
    </div>
  </div>
</div>

<script>
// 方案 A: Segmented 滑动块
(function(){
  const seg = document.getElementById('segA');
  const thumb = document.getElementById('thumbA');
  const btns = seg.querySelectorAll('button');
  function move(btn){
    const rect = btn.getBoundingClientRect();
    const parent = seg.getBoundingClientRect();
    thumb.style.left = (rect.left - parent.left - 4) + 'px';
    thumb.style.width = rect.width + 'px';
  }
  move(seg.querySelector('.active'));
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    move(b);
  });
  // 子 tab 下划线
  document.querySelectorAll('.scheme-a .sub-tabs').forEach(t => {
    t.querySelectorAll('button').forEach(b => b.onclick = () => {
      t.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });
})();

// 方案 B
document.querySelectorAll('.scheme-b .pill').forEach(p => p.onclick = () => {
  p.parentElement.querySelectorAll('.pill').forEach(x => { x.classList.remove('on'); x.classList.add('off'); });
  p.classList.remove('off'); p.classList.add('on');
});
document.querySelectorAll('.scheme-b .chip').forEach(p => p.onclick = () => {
  p.parentElement.querySelectorAll('.chip').forEach(x => { x.classList.remove('on'); x.classList.add('off'); });
  p.classList.remove('off'); p.classList.add('on');
});

// 方案 C
document.querySelectorAll('.scheme-c .group').forEach(g => {
  g.querySelectorAll('button').forEach(b => b.onclick = () => {
    g.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
});

// 方案 D
document.querySelectorAll('.scheme-d .top-bar').forEach(g => {
  g.querySelectorAll('button').forEach(b => b.onclick = () => {
    g.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
});
document.querySelectorAll('.scheme-d .sub').forEach(s => s.onclick = () => {
  s.parentElement.querySelectorAll('.sub').forEach(x => { x.classList.remove('on'); x.classList.add('off'); });
  s.classList.remove('off'); s.classList.add('on');
});
</script>
</body>
</html>
