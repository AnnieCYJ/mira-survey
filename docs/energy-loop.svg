<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="28" width="600" height="62" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="60" y="52" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">当前实现（bug）：每个 30 分钟窗口重算整个「今日分」</text>
  <text x="60" y="74" font-family="sans-serif" font-size="13" fill="#712B13">夜间输入全天不变 → 分数恒定 → 时间线是一条水平线，不是曲线</text>

  <rect x="70" y="128" width="270" height="72" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="205" y="154" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">种子 S0（醒后算一次，锁死）</text>
  <text x="205" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">夜间 HRV/RHR/睡眠 → 绝对电量 0–100</text>

  <line x1="205" y1="200" x2="205" y2="232" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="232" width="600" height="176" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="60" y="258" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">每 30 分钟窗口：只累积 ΔE，绝不重算种子</text>

  <rect x="56" y="272" width="104" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="108" y="287" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">HR 抬高</text>
  <rect x="168" y="272" width="104" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="220" y="287" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">步数 Δ</text>
  <rect x="280" y="272" width="104" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="332" y="287" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">EDA*</text>
  <rect x="392" y="272" width="104" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="444" y="287" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">HRV*</text>
  <rect x="504" y="272" width="104" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="556" y="287" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">睡眠状态</text>

  <text x="60" y="324" font-family="sans-serif" font-size="13" fill="#444441">+ 恢复（副交感 / 低应激）   − 消耗（活动 / 应激）   + 稳态回拉（防钉死 0/100）</text>
  <text x="60" y="356" font-family="sans-serif" font-size="14" font-weight="500" fill="#3B6D11">S(t) = clamp( S(t−1) + Δ , 0 , 100 )</text>

  <path d="M640 312 C 672 312 672 372 646 372" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="598" y="344" font-family="sans-serif" font-size="12" fill="#5F5E5A">t−1→t</text>

  <line x1="205" y1="408" x2="205" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="440" width="430" height="42" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="285" y="461" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">时间序列曲线 + 当前档位（≥65 / 30 / 5）</text>
</svg>
