<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mira 首页 · 现有结构 + 日出磨砂 + 半圆环</title>
<style>
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;height:100%;}
  body{background:#cdd3dc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .caption{color:#6f7889;font-size:12px;letter-spacing:.04em;max-width:420px;text-align:center;line-height:1.5;}

  .phone{position:relative;width:390px;height:844px;border-radius:47px;overflow:hidden;background:#0b1220;
    box-shadow:0 30px 70px rgba(30,45,70,.34);}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;}
  .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(20,28,44,.30) 0%, rgba(20,28,44,.12) 20%, rgba(16,22,36,.05) 38%,
      rgba(12,18,30,.40) 60%, rgba(9,13,22,.72) 80%, rgba(7,10,18,.88) 100%);}
  /* 日出柔光（顶部天光） */
  .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 60% at 78% 14%, rgba(255,244,222,.42), rgba(255,240,214,.10) 30%, rgba(255,240,214,0) 55%);}

  .screen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:0 20px;}

  /* 状态栏 */
  .statusbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 6px rgba(10,18,32,.4);}
  .sb-right{display:flex;align-items:center;gap:5px;}
  .sb-ico{width:16px;height:11px;display:block;opacity:.95}

  /* 头部（与 App 一致：今日状态居左，头像+名字居右） */
  .head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0;}
  .title{color:#fff;font-size:17px;font-weight:600;letter-spacing:.02em;text-shadow:0 1px 10px rgba(10,18,32,.45);}
  .avatarName{display:flex;align-items:center;gap:8px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;backdrop-filter:blur(8px);}
  .name{color:#fff;font-size:14px;font-weight:500;text-shadow:0 1px 8px rgba(10,18,32,.45);}

  /* 磨砂玻璃通用 */
  .glass{
    background:linear-gradient(150deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
    backdrop-filter:blur(22px) saturate(120%);
    -webkit-backdrop-filter:blur(22px) saturate(120%);
    border:1px solid rgba(255,255,255,.20);
    border-top-color:rgba(255,255,255,.36);
    box-shadow:0 12px 30px rgba(6,10,20,.26), inset 0 1px 0 rgba(255,255,255,.26);
    border-radius:22px;
  }

  /* 顶部小卡 chips（几个小圆环/小卡片） */
  .chips{display:flex;gap:10px;margin-top:14px;}
  .chip{flex:1;padding:11px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;}
  .chip svg{display:block;}
  .chip .k{color:rgba(255,255,255,.78);font-size:11px;letter-spacing:.01em;}
  .chip .v{color:#fff;font-size:15px;font-weight:640;margin-top:-2px;}

  /* 状态面板（半圆环 + 分析胶囊） */
  .panel{margin-top:16px;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;}
  .panel .plabel{color:rgba(255,255,255,.72);font-size:12px;letter-spacing:.04em;margin-bottom:2px;}
  .halfwrap{position:relative;width:260px;height:150px;margin-top:2px;}
  .center{position:absolute;left:0;right:0;top:34px;text-align:center;pointer-events:none;}
  .center .big{color:#fff;font-size:46px;font-weight:660;line-height:1;letter-spacing:.01em;text-shadow:0 2px 14px rgba(10,18,32,.4);}
  .center .word{color:#fff;font-size:15px;font-weight:560;margin-top:6px;opacity:.92;}
  .scale{display:flex;justify-content:space-between;width:236px;margin:6px auto 0;color:rgba(255,255,255,.55);font-size:10.5px;}

  /* 分析胶囊（2 行） */
  .narr{margin-top:14px;padding:13px 15px;border-radius:18px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.92);font-size:13px;line-height:1.55;letter-spacing:.01em;align-self:stretch;}
  .narr b{color:#fff;font-weight:600;}

  /* 全天状态趋势卡 */
  .trend{margin-top:14px;padding:15px 16px 13px;}
  .trend-head{display:flex;align-items:center;justify-content:space-between;}
  .trend-t{color:#fff;font-size:14px;font-weight:600;letter-spacing:.01em;}
  .trend-sub{color:rgba(255,255,255,.55);font-size:11px;margin-top:3px;}
  .chev{color:rgba(255,255,255,.6);}
  .trend svg.chart{display:block;margin-top:10px;width:100%;height:96px;}
  .legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
  .lg{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.78);font-size:11px;}
  .lg i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* 底部 AI 泡泡建议卡 */
  .bubble{margin-top:auto;margin-bottom:10px;padding:14px 16px;border-radius:22px;display:flex;gap:11px;align-items:flex-start;}
  .mark{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);
    display:flex;align-items:center;justify-content:center;color:#7a6a4a;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(10,18,32,.25);}
  .bub-body{flex:1;min-width:0;}
  .bub-tag{color:rgba(255,255,255,.6);font-size:10.5px;letter-spacing:.06em;margin-bottom:5px;}
  .bub-text{color:#fff;font-size:13.5px;line-height:1.55;letter-spacing:.01em;}
  .bub-cta{display:inline-block;margin-top:9px;padding:6px 13px;border-radius:99px;
    background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.30);color:#fff;font-size:12px;font-weight:500;}

  /* 底部 tab */
  .tabbar{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-radius:22px;margin-bottom:8px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,.55);font-size:10px;letter-spacing:.02em;}
  .tab.on{color:#fff;}
  .tab svg{opacity:.85;}
  .tab.on svg{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <img class="bg" src="bg2.jpg" alt="">
    <div class="scrim"></div>
    <div class="glow"></div>

    <div class="screen">
      <!-- 状态栏 -->
      <div class="statusbar">
        <span>07:24</span>
        <div class="sb-right">
          <svg class="sb-ico" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".45"/></svg>
          <svg class="sb-ico" viewBox="0 0 18 12" fill="none"><path d="M1 4.2C3.2 2.3 6 1.3 9 1.3s5.8 1 8 2.9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M4 7C5.4 5.9 7.1 5.3 9 5.3s3.6.6 5 1.7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="10" r="1.5" fill="#fff"/></svg>
          <svg class="sb-ico" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="3" stroke="#fff" opacity=".6"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="#fff"/><rect x="22" y="4" width="1.6" height="4" rx="0.8" fill="#fff" opacity=".6"/></svg>
        </div>
      </div>

      <!-- 头部：今日状态 / Kristina -->
      <div class="head">
        <div class="title">今日状态</div>
        <div class="avatarName">
          <div class="avatar">K</div>
          <div class="name">Kristina</div>
        </div>
      </div>

      <!-- 顶部小卡 chips（几个小圆环/小卡片） -->
      <div class="chips">
        <div class="glass chip">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <circle cx="17" cy="17" r="13" stroke="rgba(255,255,255,.26)" stroke-width="3.2"/>
            <circle cx="17" cy="17" r="13" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="82" stroke-dashoffset="15" transform="rotate(-90 17 17)"/>
          </svg>
          <div class="k">睡眠</div><div class="v">82</div>
        </div>
        <div class="glass chip">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <circle cx="17" cy="17" r="13" stroke="rgba(255,255,255,.26)" stroke-width="3.2"/>
            <circle cx="17" cy="17" r="13" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="82" stroke-dashoffset="43" transform="rotate(-90 17 17)"/>
          </svg>
          <div class="k">恢复力</div><div class="v">48</div>
        </div>
        <div class="glass chip">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <circle cx="17" cy="17" r="13" stroke="rgba(255,255,255,.26)" stroke-width="3.2"/>
            <circle cx="17" cy="17" r="13" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="82" stroke-dashoffset="25" transform="rotate(-90 17 17)"/>
          </svg>
          <div class="k">脑力</div><div class="v">70</div>
        </div>
        <div class="glass chip">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <circle cx="17" cy="17" r="13" stroke="rgba(255,255,255,.26)" stroke-width="3.2"/>
            <circle cx="17" cy="17" r="13" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="82" stroke-dashoffset="12" transform="rotate(-90 17 17)"/>
          </svg>
          <div class="k">情绪</div><div class="v">平静</div>
        </div>
      </div>

      <!-- 状态面板：半圆环 + 分析胶囊 -->
      <div class="glass panel">
        <div class="plabel">今日准备度</div>
        <div class="halfwrap">
          <svg viewBox="0 0 260 150" fill="none">
            <!-- 底弧 -->
            <path d="M26 130 A104 104 0 0 1 234 130" stroke="rgba(255,255,255,.22)" stroke-width="14" stroke-linecap="round"/>
            <!-- 进度弧（76%） -->
            <path d="M26 130 A104 104 0 0 1 234 130" stroke="#fff" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="326.7" stroke-dashoffset="78.4"/>
          </svg>
          <div class="center">
            <div class="big">76</div>
            <div class="word">平稳</div>
          </div>
        </div>
        <div class="scale"><span>0</span><span>100</span></div>

        <!-- 分析胶囊（2 行，人话口径） -->
        <div class="narr">
          昨晚 <b>11 点睡、今早 7 点起</b>，深睡比平时多 12 分钟。上午状态平稳，午后略掉，早点歇歇就好。
        </div>
      </div>

      <!-- 全天状态趋势卡 -->
      <div class="glass trend">
        <div class="trend-head">
          <div>
            <div class="trend-t">全天状态趋势</div>
            <div class="trend-sub">按情绪状态分段 · 点开看详情</div>
          </div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <svg class="chart" viewBox="0 0 320 96" preserveAspectRatio="none">
          <!-- 分段色点（全天情绪状态，压淡色） -->
          <line x1="6" y1="60" x2="314" y2="60" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
          <path d="M6 64 L52 58 L96 50 L140 56 L184 44 L228 62 L272 52 L314 48" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="52" cy="58" r="4" fill="#9fb4c9"/>
          <circle cx="96" cy="50" r="4" fill="#d9c08a"/>
          <circle cx="140" cy="56" r="4" fill="#9fb4c9"/>
          <circle cx="184" cy="44" r="4" fill="#d9c08a"/>
          <circle cx="228" cy="62" r="4" fill="#b9b2a8"/>
          <circle cx="272" cy="52" r="4" fill="#cf9b8f"/>
          <circle cx="314" cy="48" r="4" fill="#9fb4c9"/>
        </svg>
        <div class="legend">
          <span class="lg"><i style="background:#9fb4c9"></i>平静</span>
          <span class="lg"><i style="background:#d9c08a"></i>精力</span>
          <span class="lg"><i style="background:#b9b2a8"></i>疲惫</span>
          <span class="lg"><i style="background:#cf9b8f"></i>压力</span>
        </div>
      </div>

      <!-- 底部 AI 泡泡建议卡（marginTop:auto 落 Tab 上方） -->
      <div class="glass bubble">
        <div class="mark">M</div>
        <div class="bub-body">
          <div class="bub-tag">MIRA · AI 建议</div>
          <div class="bub-text">上午精神不错，午后可以走两步、晒晒太阳，整个人会松快些。</div>
          <span class="bub-cta">试试 2 分钟呼吸</span>
        </div>
      </div>

      <!-- 底部 tab -->
      <div class="glass tabbar">
        <div class="tab on">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1v-8.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          首页
        </div>
        <div class="tab">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2.4" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 9.5h17M8 4.5v-2M16 4.5v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          场景
        </div>
        <div class="tab">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-6.4-3.8-6.4-8.4C5.6 8.9 8 7 10.4 7c1.2 0 2.3.6 3 1.5.7-.9 1.8-1.5 3-1.5C18.8 7 21.2 8.9 21.2 11.6 21.2 16.2 14.8 20 14.8 20" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" transform="translate(-1.4 0)"/></svg>
          健康
        </div>
        <div class="tab">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2.8l1.9 5.4 5.4 1.9-5.4 1.9L12 17.4l-1.9-5.4-5.4-1.9 5.4-1.9L12 2.8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="18.6" cy="18.4" r="1.5" stroke="currentColor" stroke-width="1.2"/></svg>
          AI
        </div>
      </div>
    </div>
  </div>
  <div class="caption">Mira · 首页 · 按现有 App 结构（头→小卡→半圆环+分析→趋势→AI 泡泡→tab）套日出背景 + 磨砂玻璃，中央整圆环改为半圆环。颜色已压淡、以白为主。</div>
</div>
</body>
</html>
