<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mira · 情绪洞察 三组设计稿（开源设计系统参照）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{background:#E6E3EF;font-family:-apple-system,"PingFang SC","Helvetica Neue",system-ui,sans-serif;color:#3a3550;}
  .top{max-width:1120px;margin:0 auto;padding:26px 16px 6px;}
  .top h1{font-size:22px;font-weight:700;color:#2c2159;}
  .top p{font-size:13px;color:#6e6a82;margin-top:6px;line-height:1.6;}
  .wrap{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;padding:14px 16px 40px;}

  /* ── 三套主题变量 ── */
  .theme-a{--screen-bg:#F3F0FA;--card-bg:#fff;--card-border:none;--card-shadow:0 1px 2px rgba(40,30,80,.06),0 4px 14px rgba(40,30,80,.07);
    --primary:#7C6BD6;--primary-container:#E9E3FB;--on-primary-container:#2C2159;
    --title:#3A2F5E;--body:#4A4660;--sub:#6E6A82;--outline:#E3DEF2;--outline-variant:#EDEAF6;
    --seg-track:#EFEBFA;--seg-thumb:#E9E3FB;--seg-active:#2C2159;--seg-inactive:#6E6A82;
    --r-card:22px;--r-md:14px;--r-pill:999px;--axis:#6E6A82;--grid:#E3DEF2;--dot-empty:#EDEAF6;--title-w:600;}
  .theme-b{--screen-bg:#F2F1F7;--card-bg:#fff;--card-border:1px solid rgba(0,0,0,.06);--card-shadow:0 1px 3px rgba(0,0,0,.05);
    --primary:#6C5CE7;--primary-container:#ECE9FB;--on-primary-container:#3A2F8F;
    --title:#1C1C1E;--body:#3A3A3C;--sub:#8E8E93;--outline:#E5E5EA;--outline-variant:#F0F0F4;
    --seg-track:#E4E4EA;--seg-thumb:#fff;--seg-active:#6C5CE7;--seg-inactive:#8E8E93;
    --r-card:20px;--r-md:12px;--r-pill:999px;--axis:#8E8E93;--grid:#E5E5EA;--dot-empty:#E8E8ED;--title-w:600;}
  .theme-c{--screen-bg:#FAFAFA;--card-bg:#fff;--card-border:1px solid #E4E4E7;--card-shadow:0 1px 2px rgba(0,0,0,.03);
    --primary:#7C6BD6;--primary-container:#F1EEFB;--on-primary-container:#2C2159;
    --title:#18181B;--body:#3F3F46;--sub:#71717A;--outline:#E4E4E7;--outline-variant:#F4F4F5;
    --seg-track:#F4F4F5;--seg-thumb:#fff;--seg-active:#7C6BD6;--seg-inactive:#71717A;
    --r-card:14px;--r-md:10px;--r-pill:999px;--axis:#71717A;--grid:#E4E4E7;--dot-empty:#ECECEF;--title-w:600;}

  /* ── 手机 ── */
  .phone{width:344px;height:760px;background:var(--card-bg);border-radius:46px;
    box-shadow:0 26px 60px rgba(70,52,130,.2), inset 0 0 0 10px #1b1827;overflow:hidden;position:relative;flex:none;}
  .theme-b .phone{}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#1b1827;border-radius:0 0 16px 16px;z-index:40;}
  .statusbar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 7px;font-size:12px;font-weight:600;color:#2a2740;}
  .screen{height:calc(760px - 50px);overflow-y:auto;overflow-x:hidden;background:var(--screen-bg);}

  .caption{text-align:center;margin:0 6px 10px;}
  .caption .cn{font-size:14px;font-weight:700;color:var(--title);}
  .caption .cd{font-size:11px;color:var(--sub);margin-top:2px;}
  .frame{display:flex;flex-direction:column;align-items:center;}

  /* App bar */
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 12px;}
  .ab-eyebrow{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--primary);}
  .ab-title{font-size:25px;font-weight:var(--title-w);color:var(--title);margin-top:2px;letter-spacing:-.3px;}
  .ab-avatar{width:40px;height:40px;border-radius:var(--r-pill);background:var(--primary-container);color:var(--on-primary-container);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;}

  /* 分段控件 */
  .seg{position:relative;display:flex;background:var(--seg-track);border-radius:var(--r-pill);margin:0 20px;padding:4px;}
  .seg-ind{position:absolute;top:4px;left:4px;width:calc(25% - 4px);height:calc(100% - 8px);
    background:var(--seg-thumb);border-radius:var(--r-pill);transition:transform .26s cubic-bezier(.3,.8,.4,1);}
  .theme-b .seg-ind{box-shadow:0 1px 3px rgba(0,0,0,.14);}
  .theme-c .seg-ind{border:1px solid var(--outline);}
  .seg-opt{flex:1;text-align:center;padding:8px 0;font-size:13px;font-weight:600;color:var(--seg-inactive);
    border-radius:var(--r-pill);cursor:pointer;z-index:1;transition:color .2s;}
  .seg-opt.active{color:var(--seg-active);}

  .anchor{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 2px;}
  .anchor .chip{display:flex;align-items:center;gap:6px;background:var(--card-bg);border:1px solid var(--outline);
    border-radius:var(--r-pill);padding:7px 14px;font-size:13px;font-weight:600;color:var(--body);
    box-shadow:0 1px 2px rgba(40,30,80,.04);}
  .anchor .arrow{width:28px;height:28px;border-radius:var(--r-pill);background:var(--card-bg);border:1px solid var(--outline);
    display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:14px;cursor:pointer;}

  .card{background:var(--card-bg);border:var(--card-border);border-radius:var(--r-card);margin:14px 18px;padding:18px;
    box-shadow:var(--card-shadow);}
  .headrow{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;}
  .charttitle{font-size:18px;font-weight:var(--title-w);color:var(--title);letter-spacing:-.2px;}
  .headsub{font-size:11.5px;color:var(--sub);margin-top:3px;}
  .rangechip{font-size:10.5px;font-weight:600;color:var(--primary);background:var(--primary-container);
    padding:4px 10px;border-radius:var(--r-pill);}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .scrollx::-webkit-scrollbar{height:0;}
  svg{display:block;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:center;}
  .leg{display:flex;align-items:center;gap:5px;}
  .sw{width:10px;height:10px;border-radius:3px;}
  .legtxt{font-size:11.5px;color:var(--sub);}
  .hint{font-size:12.5px;color:var(--sub);line-height:1.6;}

  .statgrid{display:flex;gap:8px;margin-top:4px;}
  .tile{flex:1;border-radius:var(--r-md);padding:12px 10px;}
  .tile-l{font-size:10.5px;color:var(--sub);line-height:1.3;}
  .tile-v{font-size:19px;font-weight:700;margin-top:4px;line-height:1.1;}
  .tile-s{font-size:9.5px;color:var(--sub);margin-top:4px;line-height:1.3;}
  .analysis{font-size:12.5px;color:var(--body);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid var(--outline-variant);}
  .note{font-size:10.5px;color:var(--sub);margin-top:6px;}

  .hero{display:flex;align-items:center;gap:13px;background:var(--primary-container);border-radius:var(--r-card);padding:15px;}
  .hero-emoji{width:52px;height:52px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;box-shadow:0 2px 6px rgba(40,30,80,.1);}
  .hero-b b{font-size:16px;color:var(--title);display:block;}
  .hero-b p{font-size:12px;color:var(--primary);margin-top:3px;}
  .matrix-wrap{margin-top:4px;}
  .dot-grid{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;}
  .cell{width:100%;aspect-ratio:1/1;border-radius:3px;}
  .cell.empty{background:var(--dot-empty);}
  .timeline{display:flex;justify-content:space-between;margin-top:6px;padding:0 2px;}
  .tl{font-size:9.5px;color:var(--sub);}
  .ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px;}
  .ov{border-radius:var(--r-md);padding:12px 13px;}
  .ov-l{font-size:10.5px;color:var(--sub);}
  .ov-v{font-size:18px;font-weight:700;margin-top:4px;}
  .ov-s{font-size:9.5px;color:var(--sub);margin-top:4px;line-height:1.3;}
  .foot{text-align:center;font-size:9.5px;color:#9b97b0;padding:4px 0 18px;}
</style>
</head>
<body>
<div class="top">
  <h1>情绪洞察 · 三组设计稿</h1>
  <p>基于开源设计系统（社区反馈最好的三套方向）。每张手机里的 <b>日 / 周 / 月 / 年</b> 都能点切换。数据逻辑相同（每天一根堆叠柱 + 周期标注 + 经期对比），仅视觉语言不同。你挑一版，定了我就落进 App。</p>
</div>
<div class="wrap" id="wrap"></div>

<script>
/* ── 数据（与 App 逻辑一致，演示样本）── */
const MOODS=[
  {key:'ca',c:'#7EA6F8',t:'平静'},{key:'pl',c:'#BCCB62',t:'愉悦'},{key:'ex',c:'#F0C46E',t:'兴奋'},
  {key:'st',c:'#9D8AF0',t:'压力'},{key:'an',c:'#C9598A',t:'焦虑'}];
const PHASE={period:'#F6B3D0',follicular:'#C7B9F2',ovulation:'#D5E384',luteal:'#F0C46E',pre:'#EC9CC2',unknown:'#E5E2F0'};
const THEME_AXIS={a:{axis:'#6E6A82',grid:'#E3DEF2'},b:{axis:'#8E8E93',grid:'#E5E5EA'},c:{axis:'#71717A',grid:'#E4E4E7'}};
const PAD={LEFT:30,RIGHT:12,TOP:30,PLOT_H:150,BAND_H:15,GAP:12};
const PHASE_SEQ=['period','period','period','period','period','follicular','follicular','follicular','follicular','follicular','follicular','follicular','ovulation','ovulation','ovulation','luteal','luteal','luteal','luteal','luteal','luteal','luteal','luteal','luteal','luteal','luteal','pre','pre','pre','pre','pre','pre','pre','pre'];
function genDay(p,i){let ca=2+(i%3),pl=1+(i%2),ex=i%2,st=0,an=0;
  if(p==='period'){st=2+(i%2);an=1+(i%2);pl=Math.max(0,pl-1);}
  if(p==='pre'){st=1+(i%2);an=2+(i%2);}
  if(p==='ovulation')ex+=2; if(p==='luteal')ca+=1;
  const d={ca,pl,ex,st,an,phase:p,isPre:p==='pre'};d.total=d.ca+d.pl+d.ex+d.st+d.an;return d;}
const MONTH_DATA=PHASE_SEQ.map((p,i)=>genDay(p,i));
const YEAR_AXIS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const YEAR_PHASE=['period','follicular','follicular','ovulation','luteal','luteal','pre','pre','period','follicular','ovulation','luteal'];
const YEAR_DATA=YEAR_PHASE.map((p,i)=>{const b=70+((i*37)%80);const r=k=>Math.round(b*(0.2+(Math.sin(i*1.7+k)*0.5+0.5)*0.5));
  const d={ca:r(1),pl:r(2),ex:r(3),st:r(4),an:r(5),phase:p,isPre:p==='pre'};d.total=d.ca+d.pl+d.ex+d.st+d.an;return d;});
function roundTop(x,y,w,h,r){r=Math.min(r,w/2,h);return `M ${x} ${y+h} L ${x} ${y+r} Q ${x} ${y} ${x+r} ${y} L ${x+w-r} ${y} Q ${x+w} ${y} ${x+w} ${y+r} L ${x+w} ${y+h} Z`;}

function stackedSVG(bars,o,st){const {axis,grid}=THEME_AXIS[st];
  const LEFT=PAD.LEFT,RIGHT=PAD.RIGHT,TOP=PAD.TOP,PH=PAD.PLOT_H,BAND=PAD.BAND_H,GAP=PAD.GAP;
  const barW=o.barW,gap=o.gap;const contentW=LEFT+RIGHT+bars.length*(barW+gap);
  const stripY=TOP+PH+GAP;const xLabelY=stripY+BAND+6;const chartH=xLabelY+12;
  const yMax=Math.max(1,...bars.map(b=>b.total));const y0=TOP+PH;
  let s=`<svg width="${contentW}" height="${chartH}" viewBox="0 0 ${contentW} ${chartH}">`;
  [0,yMax/2,yMax].forEach(v=>{const y=y0-(v/yMax)*PH;
    s+=`<line x1="${LEFT}" y1="${y}" x2="${contentW-RIGHT}" y2="${y}" stroke="${grid}" stroke-width="1" stroke-dasharray="2 4" opacity="0.85"/>`;
    s+=`<text x="${LEFT-6}" y="${y+3}" text-anchor="end" font-size="10" fill="${axis}">${Math.round(v)}</text>`;});
  bars.forEach((b,i)=>{const x=LEFT+i*(barW+gap);const cx=x-gap/2+1,cw=barW+gap-2;
    if(b.phase==='period')s+=`<rect x="${cx}" y="${TOP-3}" width="${cw}" height="${PH+6}" rx="7" fill="${PHASE.period}" opacity="0.10"/>`;
    else if(b.isPre){s+=`<rect x="${cx}" y="${TOP-3}" width="${cw}" height="${PH+6}" rx="7" fill="${PHASE.pre}" opacity="0.16"/>`;
      s+=`<rect x="${cx}" y="${TOP-3}" width="${cw}" height="3.5" rx="1.75" fill="${PHASE.pre}"/>`;}});
  bars.forEach((b,i)=>{const x=LEFT+i*(barW+gap);
    if(b.total>0){let last=-1;MOODS.forEach((m,k)=>{if((b[m.key]||0)>0)last=k;});
      const barH=Math.max(4,(b.total/yMax)*PH);let cur=y0;
      MOODS.forEach((m,k)=>{const c=b[m.key]||0;if(!c)return;const h=(c/b.total)*barH;cur-=h;
        if(k===last)s+=`<path d="${roundTop(x,cur,barW,h,Math.min(5,barW/2))}" fill="${m.c}"/>`;
        else s+=`<rect x="${x}" y="${cur.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${m.c}"/>`;});
      s+=`<text x="${x+barW/2}" y="${y0-barH-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${axis}">${b.total}</text>`;
    }else{s+=`<rect x="${x}" y="${y0-3}" width="${barW}" height="3" rx="1.5" fill="${grid}"/>`;}});
  const runs=[];let cur=null;
  bars.forEach((b,i)=>{const kind=b.phase==='period'?'period':b.isPre?'pre':null;
    if(kind){if(cur&&cur.kind===kind)cur.end=i;else{if(cur)runs.push(cur);cur={kind,start:i,end:i};}}
    else if(cur){runs.push(cur);cur=null;}});if(cur)runs.push(cur);
  runs.filter(r=>r.end-r.start>=(o.runMin||1)).forEach(r=>{const cx=LEFT+(r.start+(r.end-r.start)/2+0.5)*(barW+gap);
    const txt=r.kind==='period'?'经期':'经前';const w=txt.length*12+16;
    s+=`<rect x="${cx-w/2}" y="${TOP-24}" width="${w}" height="17" rx="8.5" fill="${r.kind==='period'?PHASE.period:PHASE.pre}"/>`;
    s+=`<text x="${cx}" y="${TOP-24+12}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${txt}</text>`;});
  s+=`<rect x="${LEFT-3}" y="${stripY-3}" width="${contentW-RIGHT-LEFT+6}" height="${BAND+6}" rx="9" fill="#F3F0FA" opacity="0.6"/>`;
  s+=`<text x="${LEFT}" y="${stripY-7}" font-size="10" font-weight="600" fill="${axis}">周期阶段</text>`;
  bars.forEach((b,i)=>{const x=LEFT+i*(barW+gap);const col=b.phase==='period'?PHASE.period:b.isPre?PHASE.pre:PHASE[b.phase]||PHASE.unknown;
    s+=`<rect x="${x}" y="${stripY}" width="${barW}" height="${BAND}" rx="3.5" fill="${col}"/>`;});
  bars.forEach((b,i)=>{const x=LEFT+i*(barW+gap);s+=`<text x="${x+barW/2}" y="${xLabelY}" text-anchor="middle" font-size="10" fill="${axis}">${b.label}</text>`;});
  s+=`</svg>`;return s;}

function compareCard(bars){const sum=list=>{const days=list.length;const total=list.reduce((s,b)=>s+b.total,0);
  const neg=list.reduce((s,b)=>s+(b.st||0)+(b.an||0),0);return{days,total,neg,negShare:total>0?neg/total:0,dayAvg:days>0?total/days:0};};
  const p=sum(bars.filter(b=>b.phase==='period')),pr=sum(bars.filter(b=>b.isPre)),o=sum(bars.filter(b=>b.phase!=='period'&&!b.isPre));
  const pct=x=>Math.round(x*100)+'%';const has=bars.some(b=>b.total>0);
  if(!has)return `<div class="hint">本区间暂无情绪事件记录 · 连上戒指开启自动监测后，这里将展示真实的情绪分布与周期对比。</div>`;
  let txt='';if(pr.total>0)txt+=`经前期（距经期 ≤7 天）的消极情绪（压力 / 焦虑）占比 ${pct(pr.negShare)}，其他时期 ${pct(o.negShare)}。`;
  if(p.days>0)txt+=`经期共 ${p.days} 天，日均情绪事件 ${p.dayAvg.toFixed(1)} 次。`;
  txt+=' 周期为推算（日历 + 体温），仅帮助你观察身体节律与情绪的关联，不构成诊断。';
  return `<div class="statgrid">
    <div class="tile" style="background:${PHASE.period}1f"><div class="tile-l">经期情绪事件</div><div class="tile-v" style="color:#C24E8A">${p.total} 次</div><div class="tile-s">覆盖 ${p.days} 天</div></div>
    <div class="tile" style="background:${PHASE.pre}1f"><div class="tile-l">经前消极占比</div><div class="tile-v" style="color:#C24E8A">${pr.total>0?pct(pr.negShare):'—'}</div><div class="tile-s">压力+焦虑 / 经前事件</div></div>
    <div class="tile" style="background:${MOODS[0].c}1f"><div class="tile-l">其他期消极占比</div><div class="tile-v" style="color:#5B7FD0">${o.total>0?pct(o.negShare):'—'}</div><div class="tile-s">压力+焦虑 / 其他事件</div></div>
  </div><div class="analysis">${txt}</div><div class="note">周期为推算 · 不构成诊断</div>`;}

function chartCard(label,sub,svg){const legend=MOODS.map(m=>`<div class="leg"><div class="sw" style="background:${m.c}"></div><span class="legtxt">${m.t}</span></div>`).join('')
  +`<div class="leg"><div class="sw" style="background:${PHASE.period}"></div><span class="legtxt">经期</span></div>`
  +`<div class="leg"><div class="sw" style="background:${PHASE.pre}"></div><span class="legtxt">经前</span></div>`;
  return `<div class="card"><div class="headrow"><div><div class="charttitle">情绪分布</div><div class="headsub">${sub}</div></div><div class="rangechip">${label}</div></div>
    <div class="scrollx">${svg}</div><div class="legend">${legend}</div></div>`;}
function renderDay(){const cols=[];for(let i=0;i<96;i++){const hr=Math.floor(i/4);let col='empty';
  if(hr>=8&&hr<=22){const r=(i*53)%100;
    if(r<8)col='#C9598A';else if(r<22)col='#9D8AF0';else if(r<46)col='#F0C46E';else if(r<68)col='#BCCB62';else col='#7EA6F8';}
  cols.push(col);}
  const dots=cols.map(c=>c==='empty'?`<div class="cell empty"></div>`:`<div class="cell" style="background:${c}"></div>`).join('');
  const ticks=[0,4,8,12,16,20,24].map(h=>`<span class="tl">${String(h).padStart(2,'0')}</span>`).join('');
  const legend=MOODS.map(m=>`<div class="leg"><div class="sw" style="background:${m.c}"></div><span class="legtxt">${m.t}</span></div>`).join('');
  return `<div class="card"><div class="hero"><div class="hero-emoji">😟</div><div class="hero-b"><b>今日主情绪 · 焦虑</b><p>全天 9 次情绪记录，焦虑占多数</p></div></div>
    <div class="matrix-wrap"><div class="dot-grid">${dots}</div><div class="timeline">${ticks}</div></div>
    <div class="legend" style="margin-top:13px">${legend}</div></div>
  <div class="card"><div class="charttitle" style="margin-bottom:2px">今日概览</div><div class="ovgrid">
    <div class="ov" style="background:#FCEAF2"><div class="ov-l">情绪消耗</div><div class="ov-v" style="color:#C9598A">偏高</div><div class="ov-s">经前波动上升</div></div>
    <div class="ov" style="background:#EAF1FE"><div class="ov-l">恢复时间</div><div class="ov-v" style="color:#5B7FD0">7.2 h</div><div class="ov-s">低于平时</div></div>
    <div class="ov" style="background:#F1ECFE"><div class="ov-l">峰值时段</div><div class="ov-v" style="color:#7C6BD6">21:00</div><div class="ov-s">晚间情绪最密</div></div>
    <div class="ov" style="background:#F7F5E0"><div class="ov-l">情绪负荷</div><div class="ov-v" style="color:#B59A2E">偏重</div><div class="ov-s">压力+焦虑占 44%</div></div>
  </div></div>`;}
function renderWeek(st){const bars=MONTH_DATA.slice(-7).map((d,i)=>({...d,label:['一','二','三','四','五','六','日'][i]}));
  return chartCard('周','每天一根柱 · 按情绪占比堆叠',stackedSVG(bars,{barW:40,gap:10,runMin:1},st))+compareCard(bars);}
function renderMonth(st){const bars=MONTH_DATA.map((d,i)=>({...d,label:String(i+1)}));
  return chartCard('月','每天一根柱 · 按情绪占比堆叠',stackedSVG(bars,{barW:20,gap:6,runMin:2},st))+compareCard(bars);}
function renderYear(st){const bars=YEAR_DATA.map((d,i)=>({...d,label:YEAR_AXIS[i]}));
  return chartCard('年','每月一根柱 · 按情绪占比堆叠',stackedSVG(bars,{barW:22,gap:8,runMin:1},st))+compareCard(bars);}
const ANCHOR={day:'2026 年 9 月 30 日',week:'第 40 周',month:'2026 年 9 月',year:'2026 年'};
const DRAFTS=[
  {key:'a',name:'Material You (MD3)',desc:'Google 开源 · 最系统尺度 · 彩色亲和'},
  {key:'b',name:'Apple HIG / iOS',desc:'原生 iOS 语言 · 冷静高级'},
  {key:'c',name:'shadcn / 中性极简',desc:'react-native-reusables 美学 · 干净克制'}
];
function screenHTML(st){return `<div class="appbar"><div><div class="ab-eyebrow">身心状态</div><div class="ab-title">情绪洞察</div></div><div class="ab-avatar">M</div></div>
  <div class="seg"><div class="seg-ind"></div><div class="seg-opt" data-r="day">日</div><div class="seg-opt" data-r="week">周</div><div class="seg-opt active" data-r="month">月</div><div class="seg-opt" data-r="year">年</div></div>
  <div class="anchor"><div class="arrow">‹</div><div class="chip">2026 年 9 月</div><div class="arrow">›</div></div>
  <div class="panel"></div><div class="foot">开源设计系统参照稿 · 与 App 逻辑一致</div>`;}

const wrap=document.getElementById('wrap');
DRAFTS.forEach(d=>{
  const frame=document.createElement('div');frame.className='frame';
  const cap=document.createElement('div');cap.className='caption';cap.innerHTML=`<div class="cn">${d.name}</div><div class="cd">${d.desc}</div>`;
  const phone=document.createElement('div');phone.className='phone theme-'+d.key;
  phone.innerHTML=screenHTML(d.key);
  frame.appendChild(cap);frame.appendChild(phone);wrap.appendChild(frame);

  const seg=phone.querySelector('.seg'),ind=seg.querySelector('.seg-ind'),opts=[...seg.querySelectorAll('.seg-opt')],panel=phone.querySelector('.panel');
  const render=r=>{phone.querySelector('.chip').textContent=ANCHOR[r];
    panel.innerHTML=r==='day'?renderDay():r==='week'?renderWeek(d.key):r==='month'?renderMonth(d.key):renderYear(d.key);};
  seg.addEventListener('click',e=>{const o=e.target.closest('.seg-opt');if(!o)return;
    opts.forEach(x=>x.classList.remove('active'));o.classList.add('active');
    ind.style.transform=`translateX(${opts.indexOf(o)*100}%)`;render(o.dataset.r);});
  ind.style.transform='translateX(200%)';render('month');
});
</script>
