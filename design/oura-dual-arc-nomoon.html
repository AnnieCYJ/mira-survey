<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mira 双弧 · 去月相</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Inter',-apple-system,'PingFang SC','Helvetica Neue',sans-serif;
       padding:40px 24px 64px;-webkit-font-smoothing:antialiased}
  h1{font-weight:300;font-size:30px;letter-spacing:-1px;margin-bottom:6px}
  .sub{color:#8a8a8a;font-size:14px;font-weight:300;margin-bottom:34px;max-width:720px;line-height:1.6}
  .sub b{color:#cfcfcf;font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(2,390px);gap:30px;justify-content:center}
  @media(max-width:880px){.grid{grid-template-columns:390px}}
  .phone{width:390px;height:780px;background:#000;border-radius:44px;position:relative;overflow:hidden;
         border:1px solid #1c1c1c;box-shadow:0 30px 60px rgba(0,0,0,0.6)}
  .tag{position:absolute;top:14px;left:16px;z-index:5;font-size:11px;font-weight:500;
       letter-spacing:0.14em;text-transform:uppercase;color:#d6c283}
  .cap{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:12px;
       color:#8a8a8a;font-weight:300;padding:0 24px;line-height:1.5}
  .cap b{color:#cfcfcf;font-weight:500}
  .obar{position:absolute;top:0;left:0;right:0;height:78px;display:flex;align-items:center;
        justify-content:space-between;padding:34px 22px 0;z-index:4}
  .oword{font-size:19px;font-weight:300;letter-spacing:1px;color:#fff}
  .oico{width:30px;height:30px;border-radius:50%;border:1px solid #2a2a2a;display:flex;
        align-items:center;justify-content:center;color:#9a9a9a;font-size:13px}
  .sliders{position:absolute;bottom:16px;left:18px;right:18px;display:flex;gap:18px}
  .sliders label{flex:1;font-size:10px;color:#6a6a6a;text-transform:uppercase;letter-spacing:0.1em}
  .sliders input{width:100%;margin-top:4px;accent-color:#d6c283}
</style>
</head>
<body>
  <h1>Mira 双弧 · 去月相</h1>
  <div class="sub">你选的<b>双弧双编码</b>套扁平浅弧，去掉月相标记（V3 的月相盘不好看，移除）。外白弧=恢复分，内金弧=周期天数，两条弧独立可读。下方文字块沿用 Oura 结构：大数字 → 「恢复状态」→ 大标题 → 描述 → 按钮。出两款：A 干净（仅进度端点小圆点）/ B 加 5 个刻度点（更像 Oura 原图）。</div>
  <div class="grid">
    <div class="phone"><div class="tag">A · 干净版</div><div class="obar"><span class="oword">mira</span><span class="oico">◇</span></div><div id="p1" style="position:absolute;top:96px;left:0;right:0"></div><div class="sliders"><label>周期 day <input id="s1" type="range" min="1" max="28" value="14"></label><label>恢复分 <input id="s1b" type="range" min="40" max="100" value="82"></label></div><div class="cap">双弧 + 进度端点小圆点，无刻度、无月相。最简洁。</div></div>

    <div class="phone"><div class="tag">B · 刻度点版</div><div class="obar"><span class="oword">mira</span><span class="oico">◇</span></div><div id="p2" style="position:absolute;top:96px;left:0;right:0"></div><div class="sliders"><label>周期 day <input id="s2" type="range" min="1" max="28" value="14"></label><label>恢复分 <input id="s2b" type="range" min="40" max="100" value="82"></label></div><div class="cap">双弧 + 外弧 5 个浅刻度点（0/25/50/75/100），还原 Oura 原图细节，仍无月相。</div></div>
  </div>

<script>
const GOLD='#d6c283', TRACK='#262626', MUTED='#8a8a8a';

// 扁平浅弧几何：R=300，弦 330（x 30→360），端点 y=y0，弧顶 y0-49.5
const R=300, CXA=195, HALFC=165, SWEEP=(2*Math.asin(HALFC/R));
function pt(phi,y0){ return { x: CXA + R*Math.sin(phi), y: y0 + (R*Math.cos(SWEEP/2)) - R*Math.cos(phi) }; }
function arcD(f0,f1,y0){
  const p0=pt(f0,y0), p1=pt(f1,y0), large=(f1-f0)>Math.PI?1:0;
  return `M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`;
}

function textBlock(score, day){
  return `<div style="position:absolute;top:238px;left:0;right:0;text-align:center">
    <div style="font-size:52px;font-weight:300;letter-spacing:-1.5px;color:#fff;font-variant-numeric:tabular-nums;line-height:1">${score}</div>
    <div style="margin-top:10px;font-size:12px;color:${MUTED};letter-spacing:3px;font-weight:500">恢复状态</div>
    <div style="margin-top:26px;font-size:30px;font-weight:400;color:#fff;letter-spacing:0.5px">稳步提升</div>
    <div style="margin-top:12px;font-size:13.5px;font-weight:300;color:rgba(255,255,255,0.65);padding:0 44px;line-height:1.6">你的恢复优秀，周期第 ${day} 天，今天的身体状态高于基准。</div>
    <div style="margin-top:22px;display:inline-block;padding:10px 26px;border-radius:22px;background:rgba(255,255,255,0.1);font-size:13px;color:#fff;font-weight:400">了解更多</div>
  </div>`;
}

// A：干净双弧，无刻度无月相
function renderA(day, score){
  const y0=150, half=SWEEP/2, Ri=R-26;
  function ptI(phi){ return { x: CXA + Ri*Math.sin(phi), y: y0 + (Ri*Math.cos(SWEEP/2)) - Ri*Math.cos(phi) }; }
  function arcI(f0,f1){
    const p0=ptI(f0), p1=ptI(f1), large=(f1-f0)>Math.PI?1:0;
    return `M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} A ${Ri} ${Ri} 0 ${large} 1 ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`;
  }
  const tipR=pt(-half+SWEEP*(score/100),y0);
  const tipC=ptI(-half+SWEEP*(day/28));
  const l=pt(-half,y0), r=pt(half,y0);
  document.getElementById('p1').innerHTML=`
  <svg width="390" height="230" viewBox="0 0 390 230">
    <path d="${arcD(-half,half,y0)}" fill="none" stroke="${TRACK}" stroke-width="2.5" stroke-linecap="round"/>
    <path d="${arcD(-half,-half+SWEEP*(score/100),y0)}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="${arcI(-half,half)}" fill="none" stroke="rgba(214,194,131,0.28)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="${arcI(-half,-half+SWEEP*(day/28))}" fill="none" stroke="${GOLD}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${tipR.x.toFixed(1)}" cy="${tipR.y.toFixed(1)}" r="4.5" fill="#fff"/>
    <circle cx="${tipC.x.toFixed(1)}" cy="${tipC.y.toFixed(1)}" r="4" fill="${GOLD}"/>
    <text x="${l.x+2}" y="${l.y+26}" font-size="11" fill="${MUTED}" font-weight="500">0</text>
    <text x="${r.x-16}" y="${r.y+24}" font-size="11" fill="${MUTED}" font-weight="500" transform="rotate(45 ${r.x-8} ${r.y+20})">100</text>
    <text x="195" y="216" text-anchor="middle" font-size="11" fill="${MUTED}" letter-spacing="2">外弧 恢复 ${score} · 内弧 周期 第 ${day} 天</text>
  </svg>`+textBlock(score, day);
}

// B：双弧 + 外弧 5 个刻度点
function renderB(day, score){
  const y0=150, half=SWEEP/2, Ri=R-26;
  function ptI(phi){ return { x: CXA + Ri*Math.sin(phi), y: y0 + (Ri*Math.cos(SWEEP/2)) - Ri*Math.cos(phi) }; }
  function arcI(f0,f1){
    const p0=ptI(f0), p1=ptI(f1), large=(f1-f0)>Math.PI?1:0;
    return `M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} A ${Ri} ${Ri} 0 ${large} 1 ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`;
  }
  const tipR=pt(-half+SWEEP*(score/100),y0);
  const tipC=ptI(-half+SWEEP*(day/28));
  let ticks='';
  for(let i=0;i<=4;i++){
    const p=pt(-half+SWEEP*i/4,y0);
    ticks+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="rgba(255,255,255,0.5)"/>`;
  }
  const l=pt(-half,y0), r=pt(half,y0);
  document.getElementById('p2').innerHTML=`
  <svg width="390" height="230" viewBox="0 0 390 230">
    <path d="${arcD(-half,half,y0)}" fill="none" stroke="${TRACK}" stroke-width="2.5" stroke-linecap="round"/>
    <path d="${arcD(-half,-half+SWEEP*(score/100),y0)}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    ${ticks}
    <path d="${arcI(-half,half)}" fill="none" stroke="rgba(214,194,131,0.28)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="${arcI(-half,-half+SWEEP*(day/28))}" fill="none" stroke="${GOLD}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${tipR.x.toFixed(1)}" cy="${tipR.y.toFixed(1)}" r="4.5" fill="#fff"/>
    <circle cx="${tipC.x.toFixed(1)}" cy="${tipC.y.toFixed(1)}" r="4" fill="${GOLD}"/>
    <text x="${l.x+2}" y="${l.y+26}" font-size="11" fill="${MUTED}" font-weight="500">0</text>
    <text x="${r.x-16}" y="${r.y+24}" font-size="11" fill="${MUTED}" font-weight="500" transform="rotate(45 ${r.x-8} ${r.y+20})">100</text>
    <text x="195" y="216" text-anchor="middle" font-size="11" fill="${MUTED}" letter-spacing="2">外弧 恢复 ${score} · 内弧 周期 第 ${day} 天</text>
  </svg>`+textBlock(score, day);
}

function renderAll(){
  const day=+document.getElementById('s1').value, score=+document.getElementById('s1b').value;
  renderA(day,score); renderB(day,score);
  document.getElementById('s2').value=day; document.getElementById('s2b').value=score;
}
['s1','s1b','s2','s2b'].forEach(id=>document.getElementById(id).addEventListener('input',renderAll));
renderAll();
</script>
</body>
</html>
